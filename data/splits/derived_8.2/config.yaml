  #     station: "BACKYARD_SENSOR"
  #     latitude: 47.12345
  #     longitude: -117.12345
  #     elevation: 650
  #     start_date: "2025-03-18"
  #     end_date: "2026-03-18"
  #     freq: "D"
  #     include_soil_moisture_placeholder: true
  #
  #   clean:
  #     drop_missing: false
  #     fillna_value: null
  #     keep_columns: []
  #
  #   merge:
  #     on_columns: ["station_id", "date"]
  #     how: "outer"
