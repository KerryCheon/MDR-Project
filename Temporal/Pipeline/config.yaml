  # -----------------------------------------------------------
  # STATION 4: Sourdough Gulch SNOTEL #985
  # -----------------------------------------------------------
  sourdough_gulch:
    request:
      base_url: null # SNOTEL data - no download needed
      station: "SourdoughGulch_WA_985"
      start_year: 1979
      end_year: 2025
      timeout: 20
      min_bytes: 500
      out_dir: "Temporal/Pipeline/data/raw/sourdough/"

    parse:
      in_dir: "Temporal/Pipeline/data/raw/sourdough/"
      out_dir: "Temporal/Pipeline/data/processed/sourdough"
      drop_duplicates: true
      snotel_mode: true # Flag for SNOTEL data format
      station: "SourdoughGulch_WA_985"
      latitude: 46.233333
      longitude: -117.4
      elevation: 1210
      add_rolling_rain: true # Add 3-day rolling precipitation
      col_indices: {} # SNOTEL uses different format

