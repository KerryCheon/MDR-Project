        latitude: 4 # LATITUDE (°)
        air_temp_max: 5
        air_temp_min: 6
        air_temp_mean: 7
        air_temp_avg: 8
        precipitation: 9
        solar_radiation: 10
        sur_temp_type: 11
        sur_temp_max: 12
        sur_temp_min: 13
        sur_temp_avg: 14
        rh_max: 15
        rh_min: 16
        rh_mean: 17
        soil_moisture_5cm: 18
        soil_moisture_10cm: 19
        soil_moisture_20cm: 20
        soil_moisture_50cm: 21
        soil_moisture_100cm: 22
        soil_temp_5cm: 23
        soil_temp_10cm: 24
        soil_temp_20cm: 25
        soil_temp_50cm: 26
        soil_temp_100cm: 27

    clean:
      drop_missing: true
