name: Lint and Type Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install ruff mypy

      - name: Run Ruff
        run: |
          ruff check . --exit-zero

      - name: Run Mypy
        run: |
          mypy .
