# Configuration for derived_8.4-routing-optimize-1.0 — Guarded backbone routing
#
# Scope: routing diagnostics ONLY (CPU, no XGBoost training). Fits KMeans routers
# on trainval (or per-LOSO-fold trainval) and reports agreement / purity /
# K-sweep / margin diagnostics. Expert training (temporal 30-seed / LOSO 5-seed)
# reuses derived_8.4-formal-eval-1.0 drivers and is NOT part of this experiment.
data:
  target: "soil_moisture_5cm"
  metadata_path: "data/splits/derived_8.4/dataset_metadata.py"
  splits:
    train: "data/splits/derived_8.4/train.csv"
    val: "data/splits/derived_8.4/val.csv"
    test: "data/splits/derived_8.4/test.csv"

router:
  seed: 42
  tau: 0.10
  canonical_feature: "SMAP_sm_pm_interp_rollmean30"
  holdout_column: "station_id"

k_sweep: [2, 3, 4]

# Reference replication anchors (frozen; must reproduce exactly at seed 42):
#   full-trainval group sizes 10624/3984, ARI(V0, Backbone)=1.0 (gating-analysis-1.0)
#   LOSO no-delta means: V0 0.63434 vs Backbone 0.617115 (eval-1.4)
replication:
  full_trainval_group_sizes: [10624, 3984]
  ari_v0_backbone_full_trainval: 1.0
  # Training-run anchors (checked by run_temporal.py / run_loso.py at seed 42):
  # Backbone54 (0,0) temporal pooled R2 = eval-1.3 full baseline (identical router
  # on the full trainval + identical expert hyperparameters). Guarded/StationMean
  # anchor to eval-1.1's V0_Full (Backbone c0=0,c1=0) 0.814334 instead: §R2 shows
  # both guards reproduce the V0 test partition exactly (ARI=1.0), so they must
  # reproduce V0's number, not Backbone's (Backbone mixes 2 test rows).
  temporal_r2:
    Clustering_Backbone54_k2_c0_0_c1_0: 0.814205
    Guarded_Backbone54_k2_c0_0_c1_0: 0.814334
    StationMean_Backbone54_k2_c0_0_c1_0: 0.814334
  loso_mean_r2:
    Clustering_Backbone54_k2_c0_0_c1_0: 0.6171

model:
  # Router seed: fixed at 42 (config identity; delta additions are tied to the
  # seed-42 cluster labels, same rationale as formal-eval-1.0).
  router_seed: 42
  # Expert hyperparameters — identical to derived_8.4-eval-1.1/-1.3/-1.4 and
  # derived_8.4-formal-eval-1.0 (xgboost 3.2.0).
  exact_params:
    n_estimators: 2500
    learning_rate: 0.005
    max_depth: 9
    min_child_weight: 8
    gamma: 0.0
    reg_lambda: 0.75
    reg_alpha: 0.03
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: "hist"
    device: "cuda"

# Pinned no-delta configurations (train_ev/configs.py resolves these; the driver
# rewrites pinned_configurations.json with the resolved dicts before any run).
# Order: primary candidate first, challenger second, replication anchor third
# (also the --max-configs smoke order).
pinned_configs:
  Guarded_Backbone54_k2_c0_0_c1_0: {strategy: Guarded_Backbone54_k2, c0: 0, c1: 0, additions_source: none}
  StationMean_Backbone54_k2_c0_0_c1_0: {strategy: StationMean_Backbone54_k2, c0: 0, c1: 0, additions_source: none}
  Clustering_Backbone54_k2_c0_0_c1_0: {strategy: Clustering_Backbone54_k2, c0: 0, c1: 0, additions_source: none}

seeds:
  # 30 temporal seeds (seed 42 first: exact replication anchor; same list as formal-eval-1.0).
  temporal: [42, 7, 13, 21, 55, 99, 123, 2024, 3141, 2718, 808, 1618, 2357, 3333, 4321,
             5555, 6789, 7777, 8888, 9091, 101, 202, 303, 404, 505, 606, 707, 909, 1111, 2222]
  # 5 LOSO seeds (subset of the temporal list for consistency).
  loso: [42, 7, 13, 21, 55]

temporal:
  save_weights: true
  save_predictions: true
  predictions_dir: "predictions"
  models_dir: "models"
  n_parallel: 8
  data_version: 1

loso:
  save_weights: true
  save_predictions: true
  predictions_dir: "predictions_loso"
  holdout_column: "station_id"
  n_parallel: 8
  data_version: 1

