# Configuration for derived_8.4-formal-eval-1.0 — Formal Statistical Evaluation
#
# Publication-oriented statistical evaluation of the claim from derived_8.4-eval-1.1/-1.3:
# a two-regime (KMeans k=2) clustering model beats the single-regime global model and the
# trained-gating model, on the frozen temporal split and under LOSO spatial generalization.
#
# Protocol summary (see README.md for the full write-up):
#   - Temporal: train experts on trainval (train 2017-2020 + val 2021-2022), evaluate on the
#     frozen 2023-2025 test set, 30 random seeds (seed 42 included as replication anchor).
#   - LOSO: leave-one-station-out, router refit per fold on the 6-station trainval, 5 seeds.
#   - Delta-robustness: per-regime delta features from three selection sources:
#     (a) test-selected (pinned from eval-1.1, the historical protocol),
#     (b) val-selected (re-ranked on validation-period residuals, see select_deltas_val.py),
#     (c) none (c0=c1=0).
#   - Seed scope: only the XGBoost expert regressors' random_state varies. Routers (KMeans /
#     gating classifier) stay at seed 42 because the per-regime delta additions are tied to the
#     seed-42 cluster labels: a KMeans label flip across seeds would apply cluster-1 additions
#     to the wrong regime and silently corrupt the configuration.
#
# Known leakage and handling (paper caveats):
#   - The 54-feature shared backbone and V0-50 baseline were selected targeting the 2023-2025
#     test period (derived_8.4-feature-selection-2.0). Not re-fixable under the frozen-split
#     constraint (a new round of feature selection is expensive); shared by all compared models,
#     so relative conclusions are less affected; the test/val/none delta ablation bounds the
#     residual impact.
#   - XGBoost hyperparameters come from earlier test-era tuning; shared across all models.
data:
  target: "soil_moisture_5cm"
  metadata_path: "data/splits/derived_8.4/dataset_metadata.py"
  splits:
    train: "data/splits/derived_8.4/train.csv"
    val: "data/splits/derived_8.4/val.csv"
    test: "data/splits/derived_8.4/test.csv"

# Candidate pool reference for the data loader (the val-selected protocol rebuilds
# its own pool on val evidence — see select_deltas_val.py).
candidate_pool_file: "notebooks/experiment/derived_8.4-feature-selection-2.0/artifacts/candidate_pool.csv"

model:
  # Router/gating seed: fixed at 42 (config identity; see seed-scope note above).
  router_seed: 42
  # Expert hyperparameters — identical to derived_8.4-eval-1.1/-1.3 (xgboost 3.2.0).
  exact_params:
    n_estimators: 2500
    learning_rate: 0.005
    max_depth: 9
    min_child_weight: 8
    gamma: 0.0
    reg_lambda: 0.75
    reg_alpha: 0.03
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: "hist"
    device: "cuda"
  # Proxy model used for gain scores in the val-selected delta protocol (fs20 proxy_params).
  proxy_params:
    n_estimators: 500
    learning_rate: 0.01
    max_depth: 9
    min_child_weight: 8
    gamma: 0.0
    reg_lambda: 0.75
    reg_alpha: 0.03
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: "hist"
    device: "cuda"

shared_backbone_54:
  - precip_mm
  - s2_b4
  - s2_b8
  - SMAP_sm_pm_interp
  - D_sin_DOY
  - D_cos_DOY
  - E_SAR_ratio
  - G_API
  - G_DSLR
  - G_rain_sum_3d
  - G_rain_sum_7d
  - SMAP_sm_pm_interp_lag7
  - SMAP_sm_pm_interp_lag30
  - SMAP_sm_pm_interp_rollrange7
  - SMAP_sm_pm_interp_rollmean30
  - SMAP_sm_pm_interp_rollrange30
  - SMAP_sm_interp_rollrange7
  - SMAP_ampm_diff_interp
  - V_rollrng_G_API_kobs7
  - V_rollmax_F_NDMI_kobs30
  - A_d_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs7
  - V_rollmin_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs30
  - V_rollmin_LST_modis_kobs30
  - V_ema_LST_modis_kobs30
  - V_rollmax_F_NDVI_kobs14
  - V_rollmax_F_NDVI_kobs30
  - V_ema_F_NDVI_kobs30
  - C_lag_F_NDVI_kobs30
  - A_grad_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs14
  - V_rollrng_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs30
  - A_grad_s2_b11_kobs30
  - V_rollrng_s2_b11_kobs30
  - V_rollmin_s2_b11_kobs30
  - V_rollmin_s2_b12_kobs30
  - A_d_SMAP_sm_interp_kobs30
  - V_rollmin_SMAP_sm_interp_kobs14
  - V_rollmin_SMAP_sm_interp_kobs30
