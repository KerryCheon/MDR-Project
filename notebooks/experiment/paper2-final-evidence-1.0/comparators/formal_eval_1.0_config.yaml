# Test-selected delta additions and (c0, c1) grid points are pinned from
# derived_8.4-eval-1.1/delta_grid_summary.csv (identical parsing to eval-1.3's
# load_configurations); Clustering_Backbone54_k2 additions reuse the V0_Full grid rows
# (as in eval-1.3). The 14 pinned configs + 6 val-selected winners = 20 configs.
pinned_configs:
  # config_id -> {strategy, c0, c1, additions_source}
  #   additions_source: "eval11_grid" -> parse (c0, c1) additions from eval-1.1's
  #     delta_grid_summary.csv for the strategy's own rows; "eval11_v0full_grid" -> parse
  #     from Clustering_V0_Full_k2 rows (Backbone54 pinning, as eval-1.3);
  #     "none" -> no additions; "global" -> global single-regime models.
  Clustering_V0_Full_k2_c0_0_c1_10: {strategy: Clustering_V0_Full_k2, c0: 0, c1: 10, additions_source: eval11_grid}
  Clustering_V0_Full_k2_c0_0_c1_0: {strategy: Clustering_V0_Full_k2, c0: 0, c1: 0, additions_source: none}
  Clustering_Backbone54_k2_c0_10_c1_10: {strategy: Clustering_Backbone54_k2, c0: 10, c1: 10, additions_source: eval11_v0full_grid}
  Clustering_Backbone54_k2_c0_0_c1_0: {strategy: Clustering_Backbone54_k2, c0: 0, c1: 0, additions_source: none}
  Global_Single_54: {strategy: Global_Single, c0: null, c1: null, additions_source: global}
  Baseline_V0_50: {strategy: Global_Single, c0: null, c1: null, additions_source: global_v0}
  Univariate_G_API_k2_c0_10_c1_0: {strategy: Univariate_G_API_k2, c0: 10, c1: 0, additions_source: eval11_grid}
  Univariate_G_API_k2_c0_0_c1_0: {strategy: Univariate_G_API_k2, c0: 0, c1: 0, additions_source: none}
  Clustering_Dynamic_k2_c0_10_c1_0: {strategy: Clustering_Dynamic_k2, c0: 10, c1: 0, additions_source: eval11_grid}
  Clustering_Dynamic_k2_c0_0_c1_0: {strategy: Clustering_Dynamic_k2, c0: 0, c1: 0, additions_source: none}
  Seasonal_Binary_k2_c0_0_c1_5: {strategy: Seasonal_Binary_k2, c0: 0, c1: 5, additions_source: eval11_grid}
  Seasonal_Binary_k2_c0_0_c1_0: {strategy: Seasonal_Binary_k2, c0: 0, c1: 0, additions_source: none}
  Trained_Gating_k2_c0_5_c1_10: {strategy: Trained_Gating_k2, c0: 5, c1: 10, additions_source: eval11_grid}
  Trained_Gating_k2_c0_0_c1_0: {strategy: Trained_Gating_k2, c0: 0, c1: 0, additions_source: none}

# Val-selected delta protocol (select_deltas_val.py):
#   - Router + backbone (0,0) experts fit on TRAIN only; per-cluster residuals on VAL.
#   - Candidate-pool evidence rebuilt on val residuals + train-only gain proxy (MI/seed
#     priors kept from fs20's candidate_pool.csv, trainval-based prior evidence).
#   - 9-point delta grid evaluated on VAL (experts fit on TRAIN only, seed 42);
#     winner = best val pooled R2 (tie-break RMSE, then (c0, c1) lexicographic).
val_selection:
  strategies: ["Clustering_V0_Full_k2", "Clustering_Backbone54_k2", "Clustering_Dynamic_k2",
               "Univariate_G_API_k2", "Seasonal_Binary_k2", "Trained_Gating_k2"]
  candidate_pool_size: 96
  max_additions: 10
  delta_addition_counts: [0, 5, 10]
  canonical_mi_k: 300   # MI top-k gate for pool support (fs20's canonical profile)
  # Test-selected additions are pinned from eval-1.1's delta grid (identical parsing to eval-1.3).
  eval11_dir: "notebooks/experiment/derived_8.4-eval-1.1"
  # Prior evidence (MI ranking + seed frequency) reused from the fs20 candidate pool;
  # only the gain (train-only proxy) and residual (val) terms are recomputed.
  fs20_candidate_pool: "notebooks/experiment/derived_8.4-feature-selection-2.0/artifacts/candidate_pool.csv"
  output_json: "val_selected_deltas.json"

seeds:
  # 30 temporal seeds (seed 42 first: exact replication anchor vs eval-1.1/-1.3).
  temporal: [42, 7, 13, 21, 55, 99, 123, 2024, 3141, 2718, 808, 1618, 2357, 3333, 4321,
             5555, 6789, 7777, 8888, 9091, 101, 202, 303, 404, 505, 606, 707, 909, 1111, 2222]
  # 5 LOSO seeds (subset of the temporal list for consistency).
  loso: [42, 7, 13, 21, 55]

temporal:
  save_weights: true
  save_predictions: true
  predictions_dir: "predictions"
  models_dir: "models"
  n_parallel: 8
  data_version: 1

loso:
  save_weights: true
  save_predictions: true
  predictions_dir: "predictions_loso"
  models_dir: "models"
  holdout_column: "station_id"
  n_parallel: 8
  data_version: 1

# Replication anchors (must match to |diff| < 1e-6 for seed 42):
#   temporal: eval-1.1 pooled test R2 (reproduced exactly by eval-1.3's full baseline)
#   loso:     eval-1.2/-1.3 loso_mean_r2 per config
replication:
  temporal_r2:
    Clustering_V0_Full_k2_c0_0_c1_10: 0.814960
    Global_Single_54: 0.779230
    Baseline_V0_50: 0.760447
  loso_mean_r2:
    Clustering_Backbone54_k2_c0_10_c1_10: 0.6243
    Clustering_Backbone54_k2_c0_0_c1_0: 0.6171
    Clustering_V0_Full_k2_c0_0_c1_10: 0.6415

# Statistical reporting settings (eval_formal/stats.py + report notebook).
stats:
  alpha: 0.05
  bootstrap_resamples: 2000
  bootstrap_blocks: "station_month"   # primary; sensitivity: "station_year"
  fdr_method: "bh"                     # Benjamini-Hochberg
