# Configuration for derived_8.4-eval-mlp-1.2 — beat XGBoost with a fixed
# selection protocol (2 H100-hours budget).
#
# Follow-up to derived_8.4-eval-mlp-1.1 (best val-selected MLP 2-regime R2 0.756
# vs XGBoost 0.815; test-best reference 0.786). Changes vs 1.1:
#   1. Focus: only the two 2-REGIME families (2regime_96 primary, 2regime_54
#      secondary — the 54-family matches the XGBoost winner's feature
#      structure for the fairest head-to-head). 1-regime results are carried
#      over from 1.1 as references; no 1-regime training.
#   2. Selection protocol v3 (data_version 4):
#        a. 2-seed sweep (seeds {42, 7}) in two phases: phase 1 = 1 seed for
#           all configs; phase 2 = 2nd seed only for the top-N MLP configs per
#           family by robust score (budget: ~40% saved vs a full 2-seed sweep).
#        b. AUX2020 validation: every job is also evaluated at its best-val
#           epoch on the 2020 slice of train (n=2519, same train-fitted
#           imputer/scaler — no leakage). Robust score = mean over seeds of
#           mean(val_rmse, aux2020_rmse). This targets mlp-1.1's finding that
#           val (2021-22) selection overfits: deep residual nets top val but
#           generalize worst to 2023-25, while mid-size plain MLPs (w384x384,
#           gelu, w512x512x512) generalize best.
#        c. Winner pool restricted to plain MLPs (pre-specified). Residual and
#           FT configs are trained as 1-seed reference rows (to test the
#           robust score's de-prioritization and the FT-at-lr-1e-3 hypothesis)
#           but are NOT selectable as winners.
#   3. Model ceiling: configs concentrated on the promising region from 1.1's
#      sweep — gelu x big capacity, huber, dropout/lr refinement around the
#      test-best w512x512x512_d0.3, and 2 FT-Transformer configs at lr 1e-3
#      (README's explicit future work; 1.1's FT at 3e-4 underfit badly).
#   4. Ensembling: robust top-1 winner retrained on full trainval x 5 seeds;
#      top-3 robust MLP configs averaged offline; optional cross-architecture
#      MLP+FT ensemble if the FT robust score lands in the family top-10.
#
# Budget: ~87 jobs (~1.6 GPU-h of 2 available) with 8 parallel H100 workers;
# resumable, --only/--families/--phase2-top-n trim knobs.
#
# Families: 2regime_96 (c0/c1 both on the 96-feature candidate pool),
#           2regime_54 (c0 = 54 backbone, c1 = 54 + eval-1.1 winner's 10
#           delta features — identical to the XGBoost winner's structure).
# Cluster labels come from eval11.routers.V0FullRouter (KMeans k=2 on the 50
# V0 features, seed 42), fit on trainval — identical to eval-1.1 / mlp-1.1.

data:
  target: "soil_moisture_5cm"
  metadata_path: "data/splits/derived_8.4/dataset_metadata.py"
  splits:
    train: "data/splits/derived_8.4/train.csv"
    val: "data/splits/derived_8.4/val.csv"
    test: "data/splits/derived_8.4/test.csv"

model:
  seed: 42

# Reference leaderboards to tag rows against (XGBoost from eval-1.1; MLP-1.1
# best rows from mlp-1.1).
xgboost_reference_file: "notebooks/experiment/derived_8.4-eval-1.1/metrics_summary.csv"
mlp11_reference_file: "notebooks/experiment/derived_8.4-eval-mlp-1.1/metrics_summary.csv"

# Candidate pool from the feature-selection lab (96 features).
candidate_pool_file: "notebooks/experiment/derived_8.4-feature-selection-2.0/artifacts/candidate_pool.csv"

# Shared 54-feature global backbone discovered in derived_8.4-feature-selection-2.0.
shared_backbone_54:
  - precip_mm
  - s2_b4
  - s2_b8
  - SMAP_sm_pm_interp
  - D_sin_DOY
  - D_cos_DOY
  - E_SAR_ratio
  - G_API
  - G_DSLR
  - G_rain_sum_3d
  - G_rain_sum_7d
  - SMAP_sm_pm_interp_lag7
  - SMAP_sm_pm_interp_lag30
  - SMAP_sm_pm_interp_rollrange7
  - SMAP_sm_pm_interp_rollmean30
  - SMAP_sm_pm_interp_rollrange30
  - SMAP_sm_interp_rollrange7
  - SMAP_ampm_diff_interp
  - V_rollrng_G_API_kobs7
  - V_rollmax_F_NDMI_kobs30
  - A_d_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs7
  - V_rollmin_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs30
  - V_rollmin_LST_modis_kobs30
  - V_ema_LST_modis_kobs30
  - V_rollmax_F_NDVI_kobs14
  - V_rollmax_F_NDVI_kobs30
  - V_ema_F_NDVI_kobs30
  - C_lag_F_NDVI_kobs30
  - A_grad_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs14
  - V_rollrng_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs30
  - A_grad_s2_b11_kobs30
  - V_rollrng_s2_b11_kobs30
  - V_rollmin_s2_b11_kobs30
  - V_rollmin_s2_b12_kobs30
  - A_d_SMAP_sm_interp_kobs30
  - V_rollmin_SMAP_sm_interp_kobs14
  - V_rollmin_SMAP_sm_interp_kobs30
  - E_rough_s1_vh_kobs14
  - J_aspect_deg
  - J_bio_bio02
  - J_bio_bio13
  - J_lc_code
  - J_soil_texture_usda_b0
  - sin_year
  - cos_year
  - SMAP_x_year
  - D_z_F_NDMI
  - D_z_LST_modis
  - D_fft_dom_LST_modis_kobs30
  - D_fft_ent_LST_modis_kobs30

cluster_config:
  strategy: "Clustering_V0_Full_k2"
  c0_count: 0
  c1_count: 10
  # Cluster-1 add-only delta features = eval-1.1 winner
  # (candidate_id Clustering_V0_Full_k2_c0_0_c1_10). Loaded from eval-1.1's
  # selected_features.json when present; this list is the explicit fallback.
  cluster_1_delta_features:
    - V_rollmin_F_NDMI_kobs30
    - V_rollmean_G_API_kobs14
    - lia_mean_asc_deg
    - J_bio_bio04
    - DOY
    - SMAP_sm_am_interp
    - J_bio_bio07
    - SMAP_sm_am_interp_lag1
    - C_lag_F_NDMI_kobs30
    - SMAP_sm_pm_interp_lag1

# Families: only the 2-regime families (1-regime results carried over from 1.1).
families:
  - id: "2regime_96"
    structure: "cluster"
    features: "candidate_pool_96"
  - id: "2regime_54"
    structure: "cluster"
    features: "backbone_54"

sweep:
  n_parallel: 8          # concurrent GPU workers (small nets share one H100)
  holdout: "official_val"  # early-stop on the official val split (2021-2022)
  data_version: 4        # bump to invalidate stale job artifacts (v3 = mlp-1.1)
  seeds: [42, 7]         # 2-seed sweep; phase 2 adds the 2nd seed to top-N MLPs
  stability_seeds: [42, 7, 123, 2024, 999]  # 5-seed ensemble of the winners
  phase2_top_n: 10       # per family: configs that get the 2nd seed
  aux_year: 2020         # aux2020 holdout year inside train (n=2519)
  # Per-family config filters. A family NOT listed here runs ALL configs;
  # a listed family runs only its configs. 2regime_96 runs the full 48-config
  # list; 2regime_54 runs a curated 12-config subset (all plain MLPs matching
  # the XGBoost winner's 54-backbone feature structure).
  family_configs:
    "2regime_54":
      - w384x384_d0.3_gelu
      - w512x512x512_d0.3_gelu
      - w512x512_d0.3_gelu
      - w256x256_d0.3_gelu
      - w384x384_d0.3
      - w512x512x512_d0.3
      - w512x512x256_d0.3_gelu
      - w1024x512x256_d0.3_gelu
      - w256x256_d0.3_huber0.1
      - w384x384_d0.3_huber0.1
      - w512x512x512_d0.3_huber0.1
      - w256x256_d0.3
  defaults:
    max_epochs: 400
    patience: 60
    checkpoint_every: 20
    grad_clip: 1.0
    norm: "bn"           # bn | ln (LayerNorm)
    activation: "silu"   # silu | relu | gelu | tanh
    dropout: 0.3
    lr: 0.0003
    weight_decay: 0.0001
    batch_size: 512
    loss: "mse"          # mse | huber
    huber_delta: 0.05
    warmup_frac: 0.05    # fraction of max_epochs used for linear LR warmup
    ema: false           # exponential moving average of weights (decay 0.999)
    architecture: "mlp"  # mlp | residual | ft (FT-Transformer)
  # 57 curated configs (57 jobs at 1 seed). Prior-informed by mlp-1.1's sweep:
  #   - anchors = mlp-1.1's best test/val configs re-run under the new protocol
  #   - gelu x big capacity (1.1 showed gelu >= silu in 2-regime families)
  #   - dropout / lr / wd refinement around the test-best w512x512x512_d0.3
  #   - huber combos, deeper mid-size nets, and 2 FT at lr 1e-3 (reference)
  #   - 3 residual anchors (reference only; robust score should de-prioritize)
  # Every config runs in BOTH families (phase 1); phase 2 = 2nd seed for the
  # top-N plain-MLP configs per family by robust score.
  configs:
    # --- anchors: mlp-1.1 best test/val configs (16) ---
    - id: "w512x512x512_d0.3"
      hidden_sizes: [512, 512, 512]
    - id: "w512x512_d0.3_gelu"
      hidden_sizes: [512, 512]
      activation: "gelu"
    - id: "w512x512x256_d0.3"
      hidden_sizes: [512, 512, 256]
    - id: "w256x256x256_d0.3"
      hidden_sizes: [256, 256, 256]
    - id: "w1024x512x256_d0.3"
      hidden_sizes: [1024, 512, 256]
    - id: "w1024x1024x512_d0.3"
      hidden_sizes: [1024, 1024, 512]
    - id: "w256x256_d0.5"
      hidden_sizes: [256, 256]
      dropout: 0.5
    - id: "w512x512_d0.3_huber0.1"
      hidden_sizes: [512, 512]
      loss: "huber"
      huber_delta: 0.1
    - id: "w256x256_d0.3_gelu"
      hidden_sizes: [256, 256]
      activation: "gelu"
    - id: "w384x384_d0.3"
      hidden_sizes: [384, 384]
    - id: "w512x512_d0.3"
      hidden_sizes: [512, 512]
    - id: "w1024x1024_d0.3"
      hidden_sizes: [1024, 1024]
    - id: "w256x256_d0.3"
      hidden_sizes: [256, 256]
    - id: "w512x256x128_d0.3"
      hidden_sizes: [512, 256, 128]
    - id: "w256x256_d0.4"
      hidden_sizes: [256, 256]
      dropout: 0.4
    - id: "w256x256_d0.3_huber0.1"
      hidden_sizes: [256, 256]
      loss: "huber"
      huber_delta: 0.1
    # --- gelu x big capacity (6) ---
    - id: "w512x512x512_d0.3_gelu"
      hidden_sizes: [512, 512, 512]
      activation: "gelu"
    - id: "w384x384_d0.3_gelu"
      hidden_sizes: [384, 384]
      activation: "gelu"
    - id: "w1024x1024x512_d0.3_gelu"
      hidden_sizes: [1024, 1024, 512]
      activation: "gelu"
    - id: "w512x512x256_d0.3_gelu"
      hidden_sizes: [512, 512, 256]
      activation: "gelu"
    - id: "w256x256x256_d0.3_gelu"
      hidden_sizes: [256, 256, 256]
      activation: "gelu"
    - id: "w1024x512x256_d0.3_gelu"
      hidden_sizes: [1024, 512, 256]
      activation: "gelu"
    # --- refinement around w512x512x512_d0.3 (9) ---
    - id: "w512x512x512_d0.2"
      hidden_sizes: [512, 512, 512]
      dropout: 0.2
    - id: "w512x512x512_d0.25"
      hidden_sizes: [512, 512, 512]
      dropout: 0.25
    - id: "w512x512x512_d0.35"
      hidden_sizes: [512, 512, 512]
      dropout: 0.35
    - id: "w512x512x512_d0.4"
      hidden_sizes: [512, 512, 512]
      dropout: 0.4
    - id: "w512x512x512_d0.3_lr5e-4"
      hidden_sizes: [512, 512, 512]
      lr: 0.0005
    - id: "w512x512x512_d0.3_lr1e-3"
      hidden_sizes: [512, 512, 512]
      lr: 0.001
    - id: "w512x512x512_d0.3_wd1e-3"
      hidden_sizes: [512, 512, 512]
      weight_decay: 0.001
    - id: "w384x384x384_d0.3"
      hidden_sizes: [384, 384, 384]
    - id: "w768x384_d0.3_gelu"
      hidden_sizes: [768, 384]
      activation: "gelu"
    # --- gelu dropout / lr refinement (5) ---
    - id: "w512x512_d0.2_gelu"
      hidden_sizes: [512, 512]
      activation: "gelu"
      dropout: 0.2
    - id: "w512x512_d0.25_gelu"
      hidden_sizes: [512, 512]
      activation: "gelu"
      dropout: 0.25
    - id: "w512x512_d0.35_gelu"
      hidden_sizes: [512, 512]
      activation: "gelu"
      dropout: 0.35
    - id: "w512x512_d0.3_gelu_lr5e-4"
      hidden_sizes: [512, 512]
      activation: "gelu"
      lr: 0.0005
    - id: "w512x512_d0.3_gelu_lr1e-3"
      hidden_sizes: [512, 512]
      activation: "gelu"
      lr: 0.001
    # --- huber combos (4) ---
    - id: "w512x512x512_d0.3_huber0.1"
      hidden_sizes: [512, 512, 512]
      loss: "huber"
      huber_delta: 0.1
    - id: "w512x512x512_d0.3_huber0.05"
      hidden_sizes: [512, 512, 512]
      loss: "huber"
      huber_delta: 0.05
    - id: "w384x384_d0.3_huber0.1"
      hidden_sizes: [384, 384]
      loss: "huber"
      huber_delta: 0.1
    - id: "w512x512x256_d0.3_huber0.1"
      hidden_sizes: [512, 512, 256]
      loss: "huber"
      huber_delta: 0.1
    # --- deep / mid-size (3) ---
    - id: "w512x512x512x256_d0.3"
      hidden_sizes: [512, 512, 512, 256]
    - id: "w256x256x256x256_d0.3"
      hidden_sizes: [256, 256, 256, 256]
    - id: "w1024x512_d0.3_gelu"
      hidden_sizes: [1024, 512]
      activation: "gelu"
    # --- residual anchors: reference only, NOT selectable (3) ---
    - id: "res_w512x256x128_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 256, 128]
      dropout: 0.2
    - id: "res_w512x512x256_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 512, 256]
      dropout: 0.2
    - id: "res_w1024x1024_d0.2"
      architecture: "residual"
      hidden_sizes: [1024, 1024]
      dropout: 0.2
    # --- FT-Transformer at lr 1e-3: reference only (2) ---
    - id: "ft_d128_l4_lr1e-3"
      architecture: "ft"
      ft_d: 128
      ft_layers: 4
      lr: 0.001
    - id: "ft_d128_l6_lr1e-3"
      architecture: "ft"
      ft_d: 128
      ft_layers: 6
      lr: 0.001
