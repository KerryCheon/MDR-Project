# Configuration for derived_8.4-eval-mlp-1.1 — closing the MLP-vs-XGBoost gap.
#
# Follow-up to derived_8.4-eval-mlp-1.0 (best MLP 2-regime R² 0.759 vs XGBoost
# 0.815; 1-regime 0.723 vs 0.779). Changes vs 1.0:
#   1. data_version 3: early stopping + config selection now use the OFFICIAL
#      val split (2021-2022, n=4805) instead of a 10% per-station tail of
#      trainval (~n=1460) — 3.3x larger and exactly mirrors the temporal test
#      construction (1.0's 10% tail made holdout selection unreliable).
#   2. Longer/better training: max_epochs 400, patience 60, warmup+cosine LR,
#      optional EMA, parameterized huber delta.
#   3. More architectures: residual MLPs and FT-Transformer (strongest tabular
#      NN) alongside the plain MLP.
#   4. Feature expansion: 96-feature candidate-pool families (62 informative
#      features beyond the 54 XGBoost-tuned backbone).
#   5. Final models retrained on the full trainval (train+val) at fixed
#      best-epoch counts, + 5-seed ensembling — the NN analog of XGBoost's
#      2500-tree ensemble.
#
# Families (each runs the full 79-config sweep):
#   1regime_54: global MLP on the 54 shared backbone features.
#   2regime_54: Clustering_V0_Full_k2 winner (c0=0, c1=10): c0 = 54 backbone,
#               c1 = 54 backbone + 10 eval-1.1 delta features.
#   1regime_96: global MLP on the 96-feature candidate pool.
#   2regime_96: cluster specialists, both clusters on the 96-feature pool.
# Cluster labels come from eval11.routers.V0FullRouter (KMeans k=2 on the 50
# V0 features, seed 42), fit on trainval — identical to eval-1.1 / mlp-1.0.

data:
  target: "soil_moisture_5cm"
  metadata_path: "data/splits/derived_8.4/dataset_metadata.py"
  splits:
    train: "data/splits/derived_8.4/train.csv"
    val: "data/splits/derived_8.4/val.csv"
    test: "data/splits/derived_8.4/test.csv"

model:
  seed: 42

# Reference leaderboards to tag rows against (XGBoost from eval-1.1; MLP-1.0 best rows).
xgboost_reference_file: "notebooks/experiment/derived_8.4-eval-1.1/metrics_summary.csv"
mlp10_reference_file: "notebooks/experiment/derived_8.4-eval-mlp-1.0/metrics_summary.csv"

# Candidate pool from the feature-selection lab (96 features).
candidate_pool_file: "notebooks/experiment/derived_8.4-feature-selection-2.0/artifacts/candidate_pool.csv"

# Shared 54-feature global backbone discovered in derived_8.4-feature-selection-2.0.
shared_backbone_54:
  - precip_mm
  - s2_b4
  - s2_b8
  - SMAP_sm_pm_interp
  - D_sin_DOY
  - D_cos_DOY
  - E_SAR_ratio
  - G_API
  - G_DSLR
  - G_rain_sum_3d
  - G_rain_sum_7d
  - SMAP_sm_pm_interp_lag7
  - SMAP_sm_pm_interp_lag30
  - SMAP_sm_pm_interp_rollrange7
  - SMAP_sm_pm_interp_rollmean30
  - SMAP_sm_pm_interp_rollrange30
  - SMAP_sm_interp_rollrange7
  - SMAP_ampm_diff_interp
  - V_rollrng_G_API_kobs7
  - V_rollmax_F_NDMI_kobs30
  - A_d_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs7
  - V_rollmin_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs30
  - V_rollmin_LST_modis_kobs30
  - V_ema_LST_modis_kobs30
  - V_rollmax_F_NDVI_kobs14
  - V_rollmax_F_NDVI_kobs30
  - V_ema_F_NDVI_kobs30
  - C_lag_F_NDVI_kobs30
  - A_grad_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs14
  - V_rollrng_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs30
  - A_grad_s2_b11_kobs30
  - V_rollrng_s2_b11_kobs30
  - V_rollmin_s2_b11_kobs30
  - V_rollmin_s2_b12_kobs30
  - A_d_SMAP_sm_interp_kobs30
  - V_rollmin_SMAP_sm_interp_kobs14
  - V_rollmin_SMAP_sm_interp_kobs30
  - E_rough_s1_vh_kobs14
  - J_aspect_deg
  - J_bio_bio02
  - J_bio_bio13
  - J_lc_code
  - J_soil_texture_usda_b0
  - sin_year
  - cos_year
  - SMAP_x_year
  - D_z_F_NDMI
  - D_z_LST_modis
  - D_fft_dom_LST_modis_kobs30
  - D_fft_ent_LST_modis_kobs30

cluster_config:
  strategy: "Clustering_V0_Full_k2"
  c0_count: 0
  c1_count: 10
  # Cluster-1 add-only delta features = eval-1.1 winner
  # (candidate_id Clustering_V0_Full_k2_c0_0_c1_10). Loaded from eval-1.1's
  # selected_features.json when present; this list is the explicit fallback.
  cluster_1_delta_features:
    - V_rollmin_F_NDMI_kobs30
    - V_rollmean_G_API_kobs14
    - lia_mean_asc_deg
    - J_bio_bio04
    - DOY
    - SMAP_sm_am_interp
    - J_bio_bio07
    - SMAP_sm_am_interp_lag1
    - C_lag_F_NDMI_kobs30
    - SMAP_sm_pm_interp_lag1

# Families: structure = global | cluster; features = backbone_54 | candidate_pool_96.
families:
  - id: "1regime_54"
    structure: "global"
    features: "backbone_54"
  - id: "2regime_54"
    structure: "cluster"
    features: "backbone_54"
  - id: "1regime_96"
    structure: "global"
    features: "candidate_pool_96"
  - id: "2regime_96"
    structure: "cluster"
    features: "candidate_pool_96"

sweep:
  n_parallel: 8          # concurrent GPU workers (small nets share one H100)
  holdout: "official_val"  # data_version 3: early-stop on the official val split (2021-2022)
  data_version: 3        # bump to invalidate stale job artifacts (v2 = 10% tail, mlp-1.0)
  seed: 42
  stability_seeds: [42, 7, 123, 2024, 999]  # 5-seed ensemble of the winners
  defaults:
    max_epochs: 400
    patience: 60
    checkpoint_every: 20
    grad_clip: 1.0
    norm: "bn"           # bn | ln (LayerNorm)
    activation: "silu"   # silu | relu | gelu | tanh
    dropout: 0.3
    lr: 0.0003
    weight_decay: 0.0001
    batch_size: 512
    loss: "mse"          # mse | huber
    huber_delta: 0.05
    warmup_frac: 0.05    # fraction of max_epochs used for linear LR warmup
    ema: false           # exponential moving average of weights (decay 0.999)
    architecture: "mlp"  # mlp | residual | ft (FT-Transformer)
  # 77 curated configs. Anchor: 256x256, silu, d0.3, lr3e-4, wd1e-4, bs512, mse.
  # Every config runs in ALL four families.
  configs:
    # --- capacity (16) ---
    - id: "w128x128_d0.3"
      hidden_sizes: [128, 128]
    - id: "w256x256_d0.3"
      hidden_sizes: [256, 256]
    - id: "w384x384_d0.3"
      hidden_sizes: [384, 384]
    - id: "w512x256_d0.3"
      hidden_sizes: [512, 256]
    - id: "w512x512_d0.3"
      hidden_sizes: [512, 512]
    - id: "w768x384_d0.3"
      hidden_sizes: [768, 384]
    - id: "w768x768_d0.3"
      hidden_sizes: [768, 768]
    - id: "w1024x512_d0.3"
      hidden_sizes: [1024, 512]
    - id: "w1024x1024_d0.3"
      hidden_sizes: [1024, 1024]
    - id: "w2048x1024_d0.3"
      hidden_sizes: [2048, 1024]
    - id: "w256x256x256_d0.3"
      hidden_sizes: [256, 256, 256]
    - id: "w512x256x128_d0.3"
      hidden_sizes: [512, 256, 128]
    - id: "w512x512x256_d0.3"
      hidden_sizes: [512, 512, 256]
    - id: "w512x512x512_d0.3"
      hidden_sizes: [512, 512, 512]
    - id: "w1024x512x256_d0.3"
      hidden_sizes: [1024, 512, 256]
    - id: "w1024x1024x512_d0.3"
      hidden_sizes: [1024, 1024, 512]
    # --- dropout (10) ---
    - id: "w512x512_d0.1"
      hidden_sizes: [512, 512]
      dropout: 0.1
    - id: "w512x512_d0.2"
      hidden_sizes: [512, 512]
      dropout: 0.2
    - id: "w512x512_d0.4"
      hidden_sizes: [512, 512]
      dropout: 0.4
    - id: "w512x512_d0.5"
      hidden_sizes: [512, 512]
      dropout: 0.5
    - id: "w256x256_d0.2"
      hidden_sizes: [256, 256]
      dropout: 0.2
    - id: "w256x256_d0.4"
      hidden_sizes: [256, 256]
      dropout: 0.4
    - id: "w256x256_d0.5"
      hidden_sizes: [256, 256]
      dropout: 0.5
    - id: "w512x256x128_d0.4"
      hidden_sizes: [512, 256, 128]
      dropout: 0.4
    - id: "w512x256x128_d0.5"
      hidden_sizes: [512, 256, 128]
      dropout: 0.5
    - id: "w1024x1024_d0.5"
      hidden_sizes: [1024, 1024]
      dropout: 0.5
    # --- learning rate (10) ---
    - id: "w512x512_d0.3_lr1e-4"
      hidden_sizes: [512, 512]
      lr: 0.0001
    - id: "w512x512_d0.3_lr5e-4"
      hidden_sizes: [512, 512]
      lr: 0.0005
    - id: "w512x512_d0.3_lr1e-3"
      hidden_sizes: [512, 512]
      lr: 0.001
    - id: "w256x256_d0.3_lr1e-4"
      hidden_sizes: [256, 256]
      lr: 0.0001
    - id: "w256x256_d0.3_lr5e-4"
      hidden_sizes: [256, 256]
      lr: 0.0005
    - id: "w256x256_d0.3_lr1e-3"
      hidden_sizes: [256, 256]
      lr: 0.001
    - id: "w512x256x128_d0.3_lr1e-3"
      hidden_sizes: [512, 256, 128]
      lr: 0.001
    - id: "w1024x1024_d0.3_lr1e-4"
      hidden_sizes: [1024, 1024]
      lr: 0.0001
    - id: "w1024x1024_d0.3_lr5e-4"
      hidden_sizes: [1024, 1024]
      lr: 0.0005
    - id: "w512x256_d0.3_lr1e-3"
      hidden_sizes: [512, 256]
      lr: 0.001
    # --- weight decay (5) ---
    - id: "w512x512_d0.3_wd0"
      hidden_sizes: [512, 512]
      weight_decay: 0.0
    - id: "w512x512_d0.3_wd1e-3"
      hidden_sizes: [512, 512]
      weight_decay: 0.001
    - id: "w512x512_d0.3_wd1e-2"
      hidden_sizes: [512, 512]
      weight_decay: 0.01
    - id: "w256x256_d0.3_wd1e-2"
      hidden_sizes: [256, 256]
      weight_decay: 0.01
    - id: "w1024x1024_d0.3_wd1e-3"
      hidden_sizes: [1024, 1024]
      weight_decay: 0.001
    # --- batch size (3) ---
    - id: "w256x256_d0.3_bs256"
      hidden_sizes: [256, 256]
      batch_size: 256
    - id: "w256x256_d0.3_bs1024"
      hidden_sizes: [256, 256]
      batch_size: 1024
    - id: "w512x512_d0.3_bs1024"
      hidden_sizes: [512, 512]
      batch_size: 1024
    # --- loss (4) ---
    - id: "w256x256_d0.3_huber0.05"
      hidden_sizes: [256, 256]
      loss: "huber"
      huber_delta: 0.05
    - id: "w256x256_d0.3_huber0.1"
      hidden_sizes: [256, 256]
      loss: "huber"
      huber_delta: 0.1
    - id: "w256x256_d0.3_huber0.2"
      hidden_sizes: [256, 256]
      loss: "huber"
      huber_delta: 0.2
    - id: "w512x512_d0.3_huber0.1"
      hidden_sizes: [512, 512]
      loss: "huber"
      huber_delta: 0.1
    # --- activation (3) ---
    - id: "w256x256_d0.3_gelu"
      hidden_sizes: [256, 256]
      activation: "gelu"
    - id: "w256x256_d0.3_tanh"
      hidden_sizes: [256, 256]
      activation: "tanh"
    - id: "w512x512_d0.3_gelu"
      hidden_sizes: [512, 512]
      activation: "gelu"
    # --- norm / schedule (4) ---
    # NOTE: two EMA configs (w256x256_d0.3_ema, w512x512_d0.3_ema) were
    # trained but are EXCLUDED from the report: per-step EMA (decay 0.999) is
    # unstable when steps/epoch is small (cluster-1 specialist has ~5 steps/epoch),
    # producing a broken weight average for one specialist (test R² < 0). The 7
    # healthy EMA runs matched their non-EMA counterparts (no benefit), so EMA
    # was dropped; details in README.md.
    - id: "w256x256_d0.3_ln"
      hidden_sizes: [256, 256]
      norm: "ln"
    - id: "w512x512_d0.3_ln"
      hidden_sizes: [512, 512]
      norm: "ln"
    - id: "w256x256_d0.3_nowarmup"
      hidden_sizes: [256, 256]
      warmup_frac: 0.0
    - id: "w512x512_d0.3_warmup20"
      hidden_sizes: [512, 512]
      warmup_frac: 0.2
    # --- residual MLP (13) ---
    - id: "res_w256x256_d0.2"
      architecture: "residual"
      hidden_sizes: [256, 256]
      dropout: 0.2
    - id: "res_w256x256_d0.1"
      architecture: "residual"
      hidden_sizes: [256, 256]
      dropout: 0.1
    - id: "res_w512x256_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 256]
      dropout: 0.2
    - id: "res_w512x512_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 512]
      dropout: 0.2
    - id: "res_w512x512_d0.1"
      architecture: "residual"
      hidden_sizes: [512, 512]
      dropout: 0.1
    - id: "res_w512x512_d0.4"
      architecture: "residual"
      hidden_sizes: [512, 512]
      dropout: 0.4
    - id: "res_w512x512_d0.3_lr1e-3"
      architecture: "residual"
      hidden_sizes: [512, 512]
      dropout: 0.3
      lr: 0.001
    - id: "res_w512x512_d0.2_wd1e-3"
      architecture: "residual"
      hidden_sizes: [512, 512]
      dropout: 0.2
      weight_decay: 0.001
    - id: "res_w256x256x256_d0.2"
      architecture: "residual"
      hidden_sizes: [256, 256, 256]
      dropout: 0.2
    - id: "res_w512x512x256_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 512, 256]
      dropout: 0.2
    - id: "res_w768x384_d0.2"
      architecture: "residual"
      hidden_sizes: [768, 384]
      dropout: 0.2
    - id: "res_w512x256x128_d0.2"
      architecture: "residual"
      hidden_sizes: [512, 256, 128]
      dropout: 0.2
    - id: "res_w1024x1024_d0.2"
      architecture: "residual"
      hidden_sizes: [1024, 1024]
      dropout: 0.2
    # --- FT-Transformer (9) ---
    - id: "ft_d16_l2"
      architecture: "ft"
      ft_d: 16
      ft_layers: 2
    - id: "ft_d32_l2"
      architecture: "ft"
      ft_d: 32
      ft_layers: 2
    - id: "ft_d64_l2"
      architecture: "ft"
      ft_d: 64
      ft_layers: 2
    - id: "ft_d128_l2"
      architecture: "ft"
      ft_d: 128
      ft_layers: 2
    - id: "ft_d32_l4"
      architecture: "ft"
      ft_d: 32
      ft_layers: 4
    - id: "ft_d64_l4"
      architecture: "ft"
      ft_d: 64
      ft_layers: 4
    - id: "ft_d128_l4"
      architecture: "ft"
      ft_d: 128
      ft_layers: 4
    - id: "ft_d32_l6"
      architecture: "ft"
      ft_d: 32
      ft_layers: 6
    - id: "ft_d64_l6"
      architecture: "ft"
      ft_d: 64
      ft_layers: 6
