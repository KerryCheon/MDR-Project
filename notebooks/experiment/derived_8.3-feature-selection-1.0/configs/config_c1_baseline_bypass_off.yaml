# C1: Same as C0 but bypass OFF — measures dependence on hard-coded force-include.
data:
  target: soil_moisture_5cm
  splits:
    train: "data/splits/derived_8.3/train.csv"
    val: "data/splits/derived_8.3/val.csv"
    test: "data/splits/derived_8.3/test.csv"
  time_col: date
  id_cols:
    - station_id
  drop_cols:
    - station_id
    - date

selection:
  top_k: 50
  stability_n_boot: 50
  stability_min_keep: 20
  bypass:
    enabled: false
  stages:
    - kind: mi
      k: 300
    - kind: elasticnet
      k: 60
    - kind: stability
      min_freq: 0.6
      k: 60
      base: elasticnet

models: []

logging:
  level: INFO
  console: true
  log_to_file: true
  runs_subdir: logs
  file_name: pipeline_feat.log
  max_bytes: 10485760
  backup_count: 5
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
