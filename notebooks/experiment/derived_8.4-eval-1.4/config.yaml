# Configuration for derived_8.4-eval-1.4 LOSO Spatial Generalization Evaluation
#
# Copy of derived_8.4-eval-1.3 (all 56 configurations retained: 2 baselines + 5 MoE
# strategies x 9 delta-grid points + the 9-point Clustering_Backbone54_k2 grid) PLUS
# 12 NEW clustering configurations from the K-sweep / feature-set analysis of
# derived_8.4-gating-analysis-1.0 (5 clustering strategies x K in {2,3,4}, minus the
# three k2 combos already evaluated in eval-1.3). Each new configuration is a SINGLE
# config (no delta grid) whose per-regime experts use ONLY the 54 shared-backbone
# features — no per-regime feature additions were conducted for these regimes, so the
# backbone-only configuration is the only defensible one. Routing = KMeans
# (n_clusters=K, random_state=42, n_init=10) on the strategy's clustering feature set
# with the gating-analysis-1.0 recipe (mean-impute -> StandardScaler -> KMeans).
# Execution follows the derived_8.4-eval-2.0 parallel worker format (driver spawns
# n_parallel worker subprocesses) to utilize the H100 GPU; the existing 56 configs'
# recorded results are merged as references from derived_8.4-eval-1.3 (no retraining).
data:
  target: "soil_moisture_5cm"
  metadata_path: "data/splits/derived_8.4/dataset_metadata.py"
  splits:
    train: "data/splits/derived_8.4/train.csv"
    val: "data/splits/derived_8.4/val.csv"
    test: "data/splits/derived_8.4/test.csv"

artifacts:
  directory: "artifacts"
model:
  seed: 42
  exact_params:
    n_estimators: 2500
    learning_rate: 0.005
    max_depth: 9
    min_child_weight: 8
    gamma: 0.0
    reg_lambda: 0.75
    reg_alpha: 0.03
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: "hist"
    device: "cuda"

shared_backbone_54:
  - precip_mm
  - s2_b4
  - s2_b8
  - SMAP_sm_pm_interp
  - D_sin_DOY
  - D_cos_DOY
  - E_SAR_ratio
  - G_API
  - G_DSLR
  - G_rain_sum_3d
  - G_rain_sum_7d
  - SMAP_sm_pm_interp_lag7
  - SMAP_sm_pm_interp_lag30
  - SMAP_sm_pm_interp_rollrange7
  - SMAP_sm_pm_interp_rollmean30
  - SMAP_sm_pm_interp_rollrange30
  - SMAP_sm_interp_rollrange7
  - SMAP_ampm_diff_interp
  - V_rollrng_G_API_kobs7
  - V_rollmax_F_NDMI_kobs30
  - A_d_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs7
  - V_rollmin_E_SAR_ratio_kobs30
  - V_rollmax_E_SAR_ratio_kobs30
  - V_rollmin_LST_modis_kobs30
  - V_ema_LST_modis_kobs30
  - V_rollmax_F_NDVI_kobs14
  - V_rollmax_F_NDVI_kobs30
  - V_ema_F_NDVI_kobs30
  - C_lag_F_NDVI_kobs30
  - A_grad_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs14
  - V_rollrng_E_SAR_diff_kobs30
  - V_rollmax_E_SAR_diff_kobs30
  - A_grad_s2_b11_kobs30
  - V_rollrng_s2_b11_kobs30
  - V_rollmin_s2_b11_kobs30
  - V_rollmin_s2_b12_kobs30
  - A_d_SMAP_sm_interp_kobs30
  - V_rollmin_SMAP_sm_interp_kobs14
  - V_rollmin_SMAP_sm_interp_kobs30
  - E_rough_s1_vh_kobs14
  - J_aspect_deg
  - J_bio_bio02
  - J_bio_bio13
  - J_lc_code
  - J_soil_texture_usda_b0
  - sin_year
  - cos_year
  - SMAP_x_year
  - D_z_F_NDMI
  - D_z_LST_modis
  - D_fft_dom_LST_modis_kobs30
  - D_fft_ent_LST_modis_kobs30

candidate_pool_file: "notebooks/experiment/derived_8.4-feature-selection-2.0/artifacts/candidate_pool.csv"

delta_addition_counts: [0, 5, 10]

# Retained from eval-1.3: the two-regime clustering developed from the single-regime
# model. Routing = KMeans(k=2, seed 42) on the SAME 54 shared-backbone features used by
# `Global_Single_54`. The 9 delta-grid points reuse eval-1.1's `Clustering_V0_Full_k2`
# additions per (c0, c1); the winner is pinned to the eval-1.1 V0-Full winning grid point
# (c0=0, c1=10), decided BEFORE running.
new_clustering_strategy:
  strategy: "Clustering_Backbone54_k2"
  router_features: "shared_backbone_54"      # same 54 features as the single-regime global model
  winner: {c0: 0, c1: 10}                    # mirrors the eval-1.1 Clustering_V0_Full_k2 winner
  additions_source: "Clustering_V0_Full_k2"  # grid-point additions pinned from eval-1.1's V0-Full rows

# NEW in eval-1.4: K-sweep of the gating-analysis-1.0 clustering strategies under LOSO.
# Each entry is a SINGLE configuration (no delta grid): routing = KMeans(K, seed 42,
# n_init 10) on the strategy's clustering feature set; the per-regime experts use ONLY
# `shared_backbone_54` (no per-regime additions — no regime-specific feature selection
# was conducted for these regimes). Router feature sets are pinned below from the
# `clustering_params_*.json` exports of derived_8.4-gating-analysis-1.0 (the static set
# is the 58 columns with zero within-station variance, excluding `*_mask`/`*_isnan`).
gating_clustering_strategies:
  strategies:
    - {strategy: "Clustering_Backbone54_k3", router_features: "shared_backbone_54", K: 3}
    - {strategy: "Clustering_Backbone54_k4", router_features: "shared_backbone_54", K: 4}
    - {strategy: "Clustering_Static_k2",     router_features: "static",  K: 2}
    - {strategy: "Clustering_Static_k3",     router_features: "static",  K: 3}
    - {strategy: "Clustering_Static_k4",     router_features: "static",  K: 4}
    - {strategy: "Clustering_Weather_k2",    router_features: "weather", K: 2}
    - {strategy: "Clustering_Weather_k3",    router_features: "weather", K: 3}
    - {strategy: "Clustering_Weather_k4",    router_features: "weather", K: 4}
    - {strategy: "Clustering_Dynamic_k3",    router_features: "dynamic", K: 3}
    - {strategy: "Clustering_Dynamic_k4",    router_features: "dynamic", K: 4}
    - {strategy: "Clustering_V0_Full_k3",    router_features: "v0_full", K: 3}
    - {strategy: "Clustering_V0_Full_k4",    router_features: "v0_full", K: 4}
  router_feature_sets:
    # 58 static/environmental attributes (constant within each station: coordinates,
    # terrain, soil texture, land cover, bioclimatic normals); exported as
    # clustering_params_static_k2.json in derived_8.4-gating-analysis-1.0.
    static:
      - longitude
      - latitude
      - elev
      - slope
      - aspect
      - lia_mean_asc_deg
      - lia_std_asc_deg
      - lia_mean_desc_deg
      - lia_std_desc_deg
      - J_aspect_deg
      - J_bio_bio01
      - J_bio_bio02
      - J_bio_bio03
      - J_bio_bio04
      - J_bio_bio05
      - J_bio_bio06
      - J_bio_bio07
      - J_bio_bio08
      - J_bio_bio09
      - J_bio_bio10
      - J_bio_bio11
      - J_bio_bio12
      - J_bio_bio13
      - J_bio_bio14
      - J_bio_bio15
      - J_bio_bio16
      - J_bio_bio17
      - J_bio_bio18
      - J_bio_bio19
      - J_clay_plus_sand_b0
      - J_clay_wfrac_b0
      - J_clay_wfrac_b10
      - J_clay_wfrac_b100
      - J_clay_wfrac_b200
      - J_clay_wfrac_b30
      - J_clay_wfrac_b60
      - J_elev_m
      - J_lc_code
      - J_sand_clay_ratio_b0
      - J_sand_wfrac_b0
      - J_sand_wfrac_b10
      - J_sand_wfrac_b100
      - J_sand_wfrac_b200
      - J_sand_wfrac_b30
      - J_sand_wfrac_b60
      - J_slope_deg
      - J_soil_texture_usda_b0
      - J_soil_texture_usda_b10
      - J_soil_texture_usda_b100
      - J_soil_texture_usda_b200
      - J_soil_texture_usda_b30
      - J_soil_texture_usda_b60
      - K_sand_clay_ratio_b0
      - K_clay_plus_sand_b0
      - K_slope_sin
      - K_slope_cos
      - K_aspect_sin
      - K_aspect_cos
    # 16 core dynamic weather/land-surface drivers; exported as
    # clustering_params_weather_k2.json in derived_8.4-gating-analysis-1.0.
    weather:
      - precip_mm
      - LST_modis
      - SMAP_sm_pm_interp
      - SMAP_sm_am_interp
      - SMAP_sm_interp
      - SMAP_ampm_diff_interp
      - F_NDVI
      - F_NDMI
