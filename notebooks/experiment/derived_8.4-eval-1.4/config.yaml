    # 3 dynamic physical features (retained from the base experiment);
    # exported as clustering_params_dynamic_k2.json.
    dynamic:
      - SMAP_sm_pm_interp_lag1
      - G_API
      - LST_modis

# LOSO (leave-one-station-out) spatial generalization protocol.
# For each configuration and each held-out station s:
#   1. fold_trainval = trainval rows with station_id != s (train 2017-2020 + val 2021-2022)
#   2. fold_test     = test rows with station_id == s (2023-2025)
#   3. Router is refitted on fold_trainval only (no held-out-station leakage into routing)
#   4. Experts trained per regime cluster on fold_trainval with the configuration's features
#   5. Metrics computed on fold_test (pooled / per-year / per-regime)
# Delta additions are FIXED from derived_8.4-eval-1.1 (selected with full test-set knowledge),
# so LOSO measures generalization of model fitting given fixed features (see README caveat);
# the 12 NEW gating configurations have NO additions at all (54-backbone experts only).
loso:
  source_eval11_dir: "notebooks/experiment/derived_8.4-eval-1.1"
  # eval-1.3 recorded LOSO results for all 56 eval-1.1/eval-1.3 configs (identical
  # protocol, seed 42, xgboost 3.2.0): 47 merged from eval-1.2 as references + 9
  # Clustering_Backbone54_k2 grid points computed in eval-1.3. With
  # `--new-strategy-only` those rows are merged as references instead of being
  # recomputed (~2 h of GPU time, no new info); only the 12 NEW gating
  # configurations are computed (~1 h at 8 workers, fits the 2 h GPU wall).
  reference_eval13_dir: "notebooks/experiment/derived_8.4-eval-1.3"
  holdout_column: "station_id"
  configs: "all"  # "all" = 2 baselines + 6 strategies x 9 delta-grid points + 12 gating configs (68 configs)
  save_weights: true
  save_predictions: true
  # Parallel worker execution (derived_8.4-eval-2.0 format): the driver spawns
  # n_parallel `run_loso_worker.py` subprocesses, each training one
  # (config, station) fold. NOTE: XGBoost GPU folds serialize on a single GPU —
  # the observed per-fold wall grows ~8x at 8 workers (GPU-bound), so workers
  # buy resilience/resume, not throughput.
  n_parallel: 8
  # Bump to invalidate stale worker artifacts (job meta.json records the
  # data_version; completed folds are resumed/skipped only on an exact match).
  data_version: 1

# Station similarity / clustering analysis (hypothesis: a station generalizes well spatially
# when the LOSO training set contains a climate/geography "twin"; poorly when it stands out).
# Computed in eval14/station_sim.py and the results notebook; figures generated by the notebook.
station_clustering:
  static_features_file: "data/splits/derived_8.4/station_static_features.csv"
  static_feature_groups:
    geography: ["latitude", "longitude", "J_elev_m", "J_slope_deg", "K_aspect_sin", "K_aspect_cos"]
    climate: "WorldClim BioClim J_bio_bio01..J_bio_bio19 (BIO1-19)"
    soil: ["J_sand_wfrac_b0", "J_clay_wfrac_b0", "J_sand_wfrac_b200", "J_clay_wfrac_b200"]
  observed_climatology: "per-station mean/std of precip_mm, LST_modis, F_NDVI, SMAP_sm_interp, soil_moisture_5cm over train+val"
  standardization: "z-score across the 7 stations"
  distance: "Euclidean on standardized features; similarity = 1 - d/dmax"
  clustering: "Ward hierarchical linkage; PCA 2D projection"
  difficulty_metrics: ["median_r2 / mean_r2 (aggregate over 68 configs, loso_station_summary.csv)",
                       "winner_r2 (Clustering_Backbone54_k2 pinned winner per-station R2, loso_per_config_station.csv)"]
  isolation_metrics: ["nn_dist (1-NN)", "mean_dist (mean to other 6)", "centroid_dist"]
  hypothesis_test: "Spearman rank correlation isolation x difficulty (n=7, illustrative only)"

# Full-training baseline (replicates derived_8.4-eval-1.1: train on ALL stations, no LOSO).
# LOSO is an addition to the experiment, not a replacement — this baseline measures the
# *intrinsic* per-station test difficulty, which is contrasted with LOSO difficulty to
# separate generalization-limited stations from intrinsically hard ones. Also provides the
# temporal test R2 for configurations without an eval-1.1 row (the 9 Clustering_Backbone54_k2
# grid points + the 12 NEW gating configurations), used by the report notebook as their
# temporal reference.
# Run: python run_full_baseline.py (same pinned 68 configs as LOSO).
full_baseline:
  configs: "all"              # same 68 configs as LOSO (apples-to-apples per-station medians)
  save_weights: false         # predictions + metrics only (weights not needed for metrics)
  save_predictions: true
  predictions_dir: "predictions_full"
  validation: "per-config pooled test R2 must match eval-1.1 delta_grid_summary/metrics_summary for the 47 pinned configs (|diff| < 1e-3)"
