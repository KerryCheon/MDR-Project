# ece-daily-mean-1.0 config
# All paths are repo-root relative. No hard-coded absolute paths.
experiment: "ece-daily-mean-1.0"
purpose: >-
  Audit whether ECE in-situ raw data cover a full 24-hour day, compare daily-mean
  definitions (simple mean vs hourly-weighted mean vs median vs midnight snapshot),
  and document SNOTEL hourly vs daily averaging relative to USCRN daily01.

repo_paths:
  ece_raw_dir: "src/pipeline/data/raw/_ECE"
  ece_processed_pattern: "src/pipeline/data/processed/ece_v3_*/final.csv"
  snotel_raw_dirs:
    - "src/pipeline/data/raw/SourdoughGulch"
    - "src/pipeline/data/raw/BeaverPass"
    - "src/pipeline/data/raw/CayusePass"
    - "src/pipeline/data/raw/Paradise"
  derived_train: "data/splits/derived_8.4/train.csv"
  figures_dir: "notebooks/experiment/ece-daily-mean-1.0/figures"

ece_files:
  ECE_BBG_Main_St: "Soil Moisture Data (July 19 – August 20, 2026)(Main St (BBG)).csv"
  ECE_BBG_Lost_Meadow: "Soil Moisture Data (July 19 – August 20, 2026)(Lost Meadow Trail (BBG)).csv"
  ECE_Renton_Home: "Soil Moisture Data (July 19 – August 20, 2026)(Renton Home).csv"
  ECE_Renton_Garden_North: "Soil Moisture Data (July 19 – August 20, 2026)(Renton SG (North)).csv"
  ECE_Renton_Garden_Shed: "Soil Moisture Data (July 19 – August 20, 2026)(Renton SG (Shed)).csv"

params:
  seattle_time_col: "Timestamp (Seattle Time)"
  utc_time_col: "Timestamp (UTC)"
  sm_col: "Soil Moisture (%)"
  min_hours_per_day: 18
  eval_start: "2026-07-20"
  eval_end: "2026-08-19"
  snotel_sample_station: "SourdoughGulch"
  snotel_sample_depth: "0.050800"
