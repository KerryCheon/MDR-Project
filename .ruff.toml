# .ruff.toml

line-length = 120

[lint]
select = ["E", "F"]
ignore = [
    "E402",  # imports not at top of file (harmless in scripts)
    "E702",  # multiple statements on one line
    "F401",  # unused imports
    "F841",  # unused variable
]

exclude = [
    "deprecated/",
    "experiments/",
    "*.ipynb",
]
