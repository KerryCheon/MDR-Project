[project]
name = "mdr-soil-moisture"
version = "0.1.0"
description = "Satellite and weather-driven soil moisture estimation — MDR IEEE 2026"
requires-python = ">=3.12"
dependencies = [
    "tabulate>=0.10.0",
    "pipeline",
]

[tool.uv.sources]
pipeline = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "src/pipeline",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
