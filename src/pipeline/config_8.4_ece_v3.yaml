# ===========================================================
# Global Pipeline Configurations
# ===========================================================
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  log_to_file: false
  log_file: "src/pipeline/logs/pipeline_v3.log"

satellite:
  version: "v2"
  use_optimized: true
  batch_chunk_size: 26
  use_server_batching: true
  cache_path: "src/pipeline/data/cache/{station}_v3_satellite_cache.json"

weather:
  cache_path: "src/pipeline/data/cache/{station}_v3_weather_cache.pkl"
  timezone: "auto"
  chunk_years: 1
  timeout_seconds: 60
  hourly_vars:
    - "rain"
    - "precipitation"
  rain_col: "rain_mm"
  precip_col: "precip_mm"

temporal_fill:
  interpolate_cols:
    - "LST_modis"
    - "NDVI_modis"
    - "s1_vv"
    - "s1_vh"
    - "s2_b2"
    - "s2_b3"
    - "s2_b4"
    - "s2_b8"
    - "s2_b11"
    - "s2_b12"
    - "SMAP_sm_am"
    - "SMAP_sm_pm"
  min_known_required: 4
  imputation_order:
    - "spline"
    - "ema"
    - "rolling_mean"
    - "climatology"
    - "xgboost"
    - "knn"
    - "gaussian_process"
    - "seasonal_naive"

  ema:
    tau_days: 3.0

  rolling_mean:
    window: 7

  climatology:
    min_count_for_high_conf: 5

  xgboost:
    min_known: 10

  knn:
    n_neighbors: 3
    distance_weighting: true

  gaussian_process:
    length_scale: 20.0
    noise_level: 0.5

  seasonal_naive:
    min_count_for_high_conf: 5
    use_median: true

  spline:
    smooth: 0.5
    degree: 3
    extrap_penalty: 0.3

  ndvi_max_gap: 10
  tau_gap: 10

  high_freq_feat:
    - first_difference
    - second_difference
    - temporal_gradient
    - spectral_entropy

  outlier_factor: 3.0

whittaker:
  target_columns:
    - "NDVI_modis"
    - "NDVI"
  lambda: 5000

validator:
  n_folds: 5
  mask_fraction: 0.1
  random_seed: 42
