# ===========================================================
# Multi-Station MDR Pipeline Configuration: derived_8.4_ece_v3
# ===========================================================
# In-situ ECE Soil Moisture Sensors (Washington State)
# Warmup Period:     June 20 – July 19, 2026 (30-day scaffold)
# Evaluation Period: July 20 – August 19, 2026 (30 days ground truth)
# ===========================================================

stations:
  # -----------------------------------------------------------
  # STATION 1: ECE BBG Main St (Device 8)
  # -----------------------------------------------------------
  ece_bbg_main_st:
    request:
      base_url: null
      station: "ECE_BBG_Main_St"
      start_year: 2026
      end_year: 2026
      timeout: 20
      min_bytes: 500
      out_dir: "src/pipeline/data/raw/_ECE/"

    parse:
      in_dir: "src/pipeline/data/raw/_ECE/"
      raw_file: "src/pipeline/data/raw/_ECE/Soil Moisture Data (July 19 – August 20, 2026)(Main St (BBG)).csv"
      out_dir: "src/pipeline/data/processed/ece_v3_bbg_main_st"
      drop_duplicates: true
      ece_mode: true
      warmup_start_date: "2026-06-20"
      warmup_end_date: "2026-07-19"
      station: "ECE_BBG_Main_St"
      latitude: 47.6098164
      longitude: -122.1824678
      elevation: 51.0
      col_indices: {}

    clean:
      drop_missing: false
      fillna_value: null
      keep_columns: []

    merge:
      on_columns: ["station_id", "date"]
      how: "outer"

    save:
      out_path: "src/pipeline/data/processed/ece_v3_bbg_main_st/final.csv"
      format: "csv"
      index: false

