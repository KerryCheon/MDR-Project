stations:
  # -----------------------------------------------------------
  # STATION 1: USCRN John Day 35 WNW (OR)
  # -----------------------------------------------------------
  uscrn_john_day_35_wnw:
    request:
      base_url: null
      station: "John_Day_35_WNW"
      start_year: 2016
      end_year: 2025
      timeout: 20
      min_bytes: 500
      out_dir: "src/pipeline/data/raw/John-Day-35-WNW/"

    parse:
      in_dir: "src/pipeline/data/raw/John-Day-35-WNW/"
      out_dir: "src/pipeline/data/processed/john_day"
      drop_duplicates: true
      snotel_mode: true
      station: "John_Day_35_WNW"
      latitude: 44.55600
      longitude: -119.64590
      elevation: 684.0
      add_rolling_rain: true
      col_indices: {}

    clean:
      drop_missing: false
      fillna_value: null
      keep_columns: []

    merge:
      on_columns: ["station_id", "date"]
      how: "outer"

    save:
      out_path: "src/pipeline/data/processed/john_day/final.csv"
      format: "csv"
      index: false

