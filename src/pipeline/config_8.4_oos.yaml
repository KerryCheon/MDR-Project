# ===========================================================
# GLOBAL SECTIONS
# ===========================================================

temporal_fill:
  interpolate_cols:
    - LST_modis
    - NDVI_modis
    - s1_vv
    - s1_vh
    - s2_b2
    - s2_b3
    - s2_b4
    - s2_b8
    - s2_b11
    - s2_b12
    - SMAP_sm_am
    - SMAP_sm_pm

  min_known_required: 15

  max_gap_days: 30
  switch_gap: 4
  regression_window: 7

whittaker:
  lambda: 5000
  target_columns: ["NDVI_modis", "SMAP_sm_am"]

weather:
  cache_path: "src/pipeline/data/cache/{station}_weather_cache.pkl"
  timezone: "auto"
  chunk_years: 1
  timeout_seconds: 60
  hourly_vars: ["rain", "precipitation"]
  rain_col: "rain_mm"
  precip_col: "precip_mm"

satellite:
  version: "v2"
  use_optimized: true
  batch_chunk_size: 26
  use_server_batching: true
  cache_path: "src/pipeline/data/cache/{station}_satellite_cache.json"
  interpolate_level: "bands"

logging:
  level: "INFO"
  log_to_file: true
  file_path: "src/pipeline/logs/pipeline.log"
  imputer_file_path: "src/pipeline/logs/imputer.log"
  imputer_level: "DEBUG"
  validator_file_path: "src/pipeline/logs/validator.log"
  validator_level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  max_bytes: 10485760
  backup_count: 5

imputer:
  enabled:
    linear_interp: true
    ffill_bfill: true
    rolling_mean: true
    climatology: true
    xgboost: true
    knn: true
    gaussian_process: true
    seasonal_naive: true

  base_weights:
    linear_model: 0.25
    spline: 0.20
    gaussian_process: 0.15
    xgboost: 0.10
    knn: 0.08
    ffill_bfill: 0.07
    linear_interp: 0.06
    rolling_mean: 0.05
    climatology: 0.02
    seasonal_naive: 0.02

  linear_interp:
    tau_days: 7.0

  linear_model:
    enabled: true
    min_known: 15
    use_cross_features: true

  ffill_bfill:
    tau_days: 3.0

  rolling_mean:
    window: 7

  climatology:
    min_count_for_high_conf: 10

  xgboost:
    min_known: 30

  knn:
    n_neighbors: 5
    distance_weighting: true

  gaussian_process:
    length_scale: 20.0
    noise_level: 0.5

  seasonal_naive:
    min_count_for_high_conf: 10
    use_median: true

  spline:
    smooth: 0.5
    degree: 3
    extrap_penalty: 0.3

  ndvi_max_gap: 10
  tau_gap: 10

  high_freq_feat:
    - first_difference
    - second_difference
    - temporal_gradient
    - spectral_entropy

  outlier_factor: 3.0

validator:
  n_folds: 5
  mask_fraction: 0.1
  random_seed: 42
